function campaignCounts(c){

  H`التسليم داخل التطبيق: ${esc(c.delivered??0)}`,
  H`الفتح: ${esc(c.opened??0)}`,
  H`الدفع المقبول: ${esc(c.push_sent??0)}`,

}

function fitAdminDialog(){if(!window.visualViewport)return;document.documentElement.style.setProperty('--admin-visible-height',Math.round(window.visualViewport.height)+'px');document.documentElement.style.setProperty('--admin-visible-top',Math.round(window.visualViewport.offsetTop)+'px');}

client().auth.onAuthStateChange((event,session)=>{if((event==='SIGNED_OUT'||(session?.user&&user&&session.user.id!==user.id))&&user){clearPrivate();user=null;login();}if(event==='PASSWORD_RECOVERY')setTimeout(()=>modal(T('تغيير كلمة المرور'),field('password',T('كلمة المرور الجديدة'),'','password','required minlength="10"'),async f=>{const r=await client().auth.updateUser({password:f.get('password')});if(r.error)throw r.error;}),0);});
let startupFlight=null;
function startupView(note=''){adminAuthorized=false;root.innerHTML=H`<section id="adminStartup" class="panel login"><div class="brand">MASARIFI / ADMIN</div><h1>إدارة مصاريفي</h1><p role="status">${M(navigator.onLine===false?'افتح الإدارة عند عودة الاتصال':'جار التحقق من جلسة الإدارة…')}</p><p class="hint">إعدادات الجهاز متاحة دون اتصال. تتطلب بيانات الإدارة اتصالًا والتحقق من الصلاحية.</p>${preferenceFields()}<p class="error" id="authError" role="alert">${esc(note)}</p>${b('startup-retry',T('إعادة المحاولة'))}</section>`;}
function startAdmin(){if(startupFlight)return startupFlight;startupView();if(navigator.onLine===false)return Promise.resolve();let complete;const task=new Promise(resolve=>{complete=resolve;});startupFlight=task;(async()=>{try{const {data}=await boundedRequest(()=>client().auth.getSession());user=data.session?.user;if(user&&!user.is_anonymous)await load();else if(window.DeviceIdentity&&await(await identityStore()).read('deviceCredential')){user=await(await adminIdentity()).ensure();await load();}else login();}catch(e){if(/network_timeout|offline|fetch|network/i.test(e?.message||''))startupView(message(e));else login(message(e));}finally{if(startupFlight===task)startupFlight=null;complete();}})();return task;}
startAdmin();
